name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel duplicate runs on the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: lint + typecheck + test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # ─────────────────────────────────────────────────────────────────────
    # Throwaway Postgres for this one CI run.
    #
    # GitHub Actions spins this container up inside the isolated runner VM,
    # uses it for the test job, then destroys both the container AND the VM
    # when the job finishes. Nothing is published, persisted, or reachable
    # from outside the runner. The "password" below is just the value the
    # ephemeral container will accept as login — there is no real credential
    # here. Same pattern recommended in GitHub's own docs:
    # https://docs.github.com/en/actions/use-cases-and-examples/using-containerized-services/about-service-containers
    # ─────────────────────────────────────────────────────────────────────
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_throwaway_not_a_real_secret
          POSTGRES_DB: ci_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d ci_db"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30

    env:
      # Both URLs point at the same in-VM container (no PgBouncer in CI, so
      # tests don't need the direct/pooled split that the real Neon setup has).
      DATABASE_URL: postgresql://ci_user:ci_throwaway_not_a_real_secret@localhost:5432/ci_db
      DATABASE_DIRECT_URL: postgresql://ci_user:ci_throwaway_not_a_real_secret@localhost:5432/ci_db

      # Hardcoded test-only JWT secrets — Zod schema requires min 32 chars,
      # these strings exist only inside the runner VM and never sign real
      # tokens. Real JWT_SECRET / JWT_REFRESH_COOKIE_SECRET live in Railway
      # for the deployed API.
      JWT_SECRET: ci_jwt_secret_not_used_outside_this_vm_ever_xxxxxxxxxx
      JWT_REFRESH_COOKIE_SECRET: ci_refresh_secret_not_used_outside_this_vm_ever_xxxxxxxxx

      # Cost guards stay on defaults; bumping them in tests lets boundary tests
      # exercise the 100-chat / 5-PDF limits without needing 100 real chats.
      NODE_ENV: test
      LOG_LEVEL: error

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Don't pass `version:` here — the action reads `packageManager` from
      # package.json (`"packageManager": "pnpm@10.0.0"`). Specifying both is
      # a hard error: ERR_PNPM_BAD_PM_VERSION.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (ESLint flat config)
        run: pnpm lint

      - name: Typecheck (all packages)
        run: pnpm typecheck

      - name: Build (catches dist-only errors)
        run: pnpm build

      # The migrate runner also installs pgvector / citext / pgcrypto via
      # CREATE EXTENSION IF NOT EXISTS (see packages/db/scripts/migrate.ts),
      # so no separate init.sql step is needed.
      - name: Apply migrations
        run: pnpm db:migrate

      - name: Test (vitest, sequential)
        run: pnpm test

      # Visible-on-failure diagnostics. The vitest output already includes
      # failing test names; this step also dumps the DB schema + env so the
      # next iteration doesn't require log archaeology.
      - name: Diagnostics on failure
        if: failure()
        run: |
          echo "::group::env (sensitive vars redacted)"
          env | grep -Ei '^(node|database|jwt|log|ci)' | sed -E 's/(_PASSWORD|_SECRET)=.*/\1=[REDACTED]/'
          echo "::endgroup::"
          echo "::group::pg version + extensions"
          PGPASSWORD=ci_throwaway_not_a_real_secret psql -h localhost -U ci_user -d ci_db -c "SELECT version();" -c "SELECT extname FROM pg_extension;" || true
          echo "::endgroup::"
          echo "::group::tables"
          PGPASSWORD=ci_throwaway_not_a_real_secret psql -h localhost -U ci_user -d ci_db -c "\dt" || true
          echo "::endgroup::"
